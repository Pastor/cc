[package]
name = "cc-storage"
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Отправка почты по SMTP. Выключена по умолчанию: без настроенного релея она
# бесполезна, а зависимость тянет за собой TLS-стек.
default = []
smtp = ["dep:lettre"]
# Обмен кода авторизации у VK ID. Выключен по умолчанию: без настроенного
# приложения провайдера он бесполезен, а зависимость тянет HTTP-клиент и TLS.
oauth = ["dep:oauth2", "dep:serde", "dep:serde_json"]

[dependencies]
cc-crypto.workspace = true
lettre = { workspace = true, optional = true }
oauth2 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
cc-domain.workspace = true
base64.workspace = true
subtle.workspace = true
thiserror.workspace = true
tracing.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["sync", "fs", "io-util", "rt", "time", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
criterion.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[bench]]
name = "sessions"
harness = false
