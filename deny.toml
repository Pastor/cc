# Политика зависимостей.
#
# Прежний проект накопил уязвимые и мёртвые библиотеки, и единственной защитой
# был Dependabot, покрывавший лишь часть графа. Правила ниже проверяются в CI и
# блокируют слияние.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0436: крейт paste объявлен не поддерживаемым. Он приходит
    # транзитивно из utoipa-axum и заменить его мы не можем. Уязвимости в нём
    # нет — только отсутствие сопровождения; это макрос времени компиляции,
    # который в собранный бинарник не попадает. Исключение снимается, когда
    # utoipa-axum перейдёт на поддерживаемую замену: TASK-052.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Крейты рабочего пространства ссылаются друг на друга путём: версия у них общая
# и задана в [workspace.package], поэтому требовать её в каждой ссылке незачем.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
