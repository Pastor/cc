[workspace]
resolver = "2"
members = [
    "crates/cc-client",
    "crates/cc-domain",
    "crates/cc-crypto",
    "crates/cc-storage",
    "crates/cc-api",
    "crates/cc-server",
]

[workspace.package]
# Крейты рабочего пространства не публикуются: это части одного сервиса, а не
# библиотеки общего пользования.
publish = false
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/Pastor/cc"

[workspace.dependencies]
cc-api = { path = "crates/cc-api" }
cc-client = { path = "crates/cc-client" }
cc-crypto = { path = "crates/cc-crypto" }
cc-domain = { path = "crates/cc-domain" }
cc-storage = { path = "crates/cc-storage" }
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }
thiserror = { version = "2.0.20", default-features = false }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc", "getrandom"] }
hkdf = { version = "0.13.0", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
hmac = { version = "0.12.1", default-features = false }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9.0", default-features = false, features = ["derive"] }
subtle = { version = "2.6.1", default-features = false }
rand_core = { version = "0.6.4", default-features = false }
getrandom = { version = "0.2.17", default-features = false }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
uuid = { version = "1.25.0", default-features = false, features = ["v4", "std"] }
time = { version = "0.3.55", default-features = false, features = ["std"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tempfile = { version = "3.27.0", default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path"] }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.0", default-features = false, features = ["limit", "timeout", "set-header", "request-id", "trace"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
figment = { version = "0.10.19", default-features = false, features = ["env", "toml"] }
http = { version = "1", default-features = false }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
utoipa = { version = "5.5.0", default-features = false, features = ["axum_extras", "macros"] }
utoipa-axum = { version = "0.2.0", default-features = false }
utoipa-swagger-ui = { version = "9.0.2", default-features = false, features = ["axum", "vendored"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
