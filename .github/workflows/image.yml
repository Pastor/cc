# Сборка образа.
#
# Образ собирается на каждое изменение, но публикуется только из master: так
# поломка сборки видна на разборе изменения, а не в день выпуска.

name: Образ

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Собрать образ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Сборка
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cstorage:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
