# Обновление зависимостей отдельным изменением.
#
# RULE.md требует, чтобы cargo update был самостоятельным изменением со своим
# разбором: бамп транзитивной зависимости меняет поведение, и смешивать его с
# работой над задачей нельзя.

name: Обновление зависимостей

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Обновить Cargo.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo update
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: cargo-update
          title: Обновление зависимостей
          commit-message: |
            Обновить Cargo.lock

            Изменение выпущено отдельно от работы над задачами: обновление
            транзитивной зависимости способно изменить поведение, и разбирать
            его нужно самостоятельно.
          body: |
            Автоматическое обновление `Cargo.lock`.

            Перед слиянием убедитесь, что ворота качества пройдены, и просмотрите
            изменения версий: обновление транзитивной зависимости способно
            изменить поведение.
