# Пример конфигурации cStore.
#
# Файл читается первым, переменные окружения с префиксом CC_ перекрывают его
# значения: вложенность разделяется двойным подчёркиванием, например
# CC_SECRETS__SERVER задаёт secrets.server.
#
# Путь к этому файлу передаётся переменной CC_CONFIG.

# Адрес, на котором сервер принимает соединения. Порт 0 означает эфемерный.
listen = "127.0.0.1:8443"

# Корень хранилища шифротекста. Каталог создаётся при запуске.
storage = "./var/storage"

[secrets]
# Серверный секрет: из него выводится правдоподобная соль для неизвестных
# логинов и им укрепляется аутентификационный хеш. Значения по умолчанию нет —
# без него сервер не запустится. В рабочем развёртывании задавайте переменной
# окружения CC_SECRETS__SERVER, а не файлом.
server = "замените-на-случайное-значение"

[limits]
# Наибольший размер тела запроса в байтах.
body_bytes = 16777216
# Таймаут обработки запроса в секундах.
request_seconds = 30
# Срок жизни сессии в часах.
session_hours = 12
# Срок жизни запроса авторизации у внешнего провайдера в минутах. Он же — окно
# свежести подписанных данных виджета Telegram.
authorization_minutes = 5

# Внешние провайдеры входа. Блоков может не быть вовсе: тогда внешний вход не
# работает. Учётная запись через него не создаётся ни при каких условиях —
# это способ войти в уже существующую запись с привязанной личностью.
#
# [secrets.vk]
# client = "52000000"
# secret = "секрет-приложения-vk-id"
# redirect = "https://cstore.example/auth/vk/callback"
#
# [secrets.telegram]
# token = "токен-бота-telegram"
